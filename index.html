function ca(g,m){g.an=[[m.f,m.t]];if(m.k)g.an.push(m.t>m.f?[m.f+3,m.f+1]:[m.f-4,m.f-1]);mk(g,m);g.last=[m.f,m.t];g.sel=-1;g.turn=g.t>0?0:1;g.ph.push(ck(g));const ms=lg(g),c=at(g,g.K[ci(g.t)],-g.t);g.chk=c?1:0;let n=0,x=0;
g.b.forEach(p=>{const a=Math.abs(p);if(a&&a!=6){n++;if(a!=2&&a!=3)x=9}});
if(!ms.length){g.over=1;if(c){g.res=1-g.turn;g.why='v_mate'}else{g.res=2;g.why='v_stale'}}
else if(n==0||(n==1&&x!=9)||g.hm>=100||g.ph.filter(k=>k==g.ph[g.ph.length-1]).length>=3){g.over=1;g.res=2}}
function ct(g,i){const p=g.b[i];if(g.sel>=0){const m=lg(g).filter(x=>x.f==g.sel&&x.t==i);if(m.length)return ca(g,m.find(x=>!x.p||x.p==5))}g.sel=p*g.t>0&&g.sel!=i?i:-1}
/* ===== 틱택토 ===== */
const L3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],tw=b=>L3.find(l=>b[l[0]]>=0&&b[l[0]]==b[l[1]]&&b[l[0]]==b[l[2]]);
function tp(g,i){if(g.b[i]>=0)return;g.b[i]=g.turn;const l=tw(g.b);if(l){g.over=1;g.res=g.turn;g.line=l}else if(!g.b.includes(-1)){g.over=1;g.res=2}else g.turn=1-g.turn}
function mm(b,tn,me,d){const l=tw(b);if(l)return b[l[0]]==me?10-d:d-10;if(!b.includes(-1))return 0;let r=tn==me?-99:99;
for(let i=0;i<9;i++)if(b[i]<0){b[i]=tn;const v=mm(b,1-tn,me,d+1);b[i]=-1;r=tn==me?Math.max(r,v):Math.min(r,v)}return r}
/* ===== 오목 (5개 이상이면 승리) ===== */
const N=15,DR=[[1,0],[0,1],[1,1],[1,-1]],PC=new Map();
const pat=s=>{let v=PC.get(s);if(v!==undefined)return v;const h=p=>{for(let o=Math.max(0,5-p.length);o<=Math.min(4,9-p.length);o++)if(s.substr(o,p.length)==p)return 1};
if(h('11111'))v=1e5;else if(h('011110'))v=1e4;else{v=0;if(['001110','011100','010110','011010'].some(h))v=1e3;
for(let o=0;o<5;o++){const w=s.substr(o,5);if(!w.includes('2'))v=Math.max(v,[0,1,15,150,2e3][w.split('1').length-1])}}PC.set(s,v);return v};
const ls=(b,x,y,p)=>{let r=0;for(const[dx,dy]of DR){let s='';for(let k=-4;k<=4;k++){const X=x+dx*k,Y=y+dy*k;s+=!k?'1':X<0||Y<0||X>=N||Y>=N?'2':b[Y*N+X]==p?'1':b[Y*N+X]<0?'0':'2'}r+=pat(s)}return r};
const ow=(b,i,p)=>{const x=i%N,y=i/N|0;for(const[dx,dy]of DR){const c=[i];for(const s of[1,-1]){let X=x+dx*s,Y=y+dy*s;while(X>=0&&Y>=0&&X<N&&Y<N&&b[Y*N+X]==p){c.push(Y*N+X);X+=dx*s;Y+=dy*s}}if(c.length>=5)return c}};
function op(g,i){if(g.b[i]>=0)return;g.b[i]=g.turn;g.last=i;g.n++;const l=ow(g.b,i,g.turn);if(l){g.over=1;g.res=g.turn;g.line=l}else if(g.n>=225){g.over=1;g.res=2}else g.turn=1-g.turn}
/* ===== AI ===== */
const AI={
ttt:g=>{const b=g.b,me=g.turn,f=[];b.forEach((v,i)=>v<0&&f.push(i));if(f.length==9||Math.random()<.2)return tp(g,f[rnd(f.length)]);
let bt=-99,bs=[];f.forEach(i=>{b[i]=me;const v=mm(b,1-me,me,1);b[i]=-1;if(v>bt){bt=v;bs=[i]}else if(v==bt)bs.push(i)});tp(g,bs[rnd(bs.length)])},
omok:g=>{const b=g.b,me=g.turn,C=new Set();b.forEach((v,i)=>{if(v>=0){const x=i%N,y=i/N|0;for(let a=-2;a<=2;a++)for(let c=-2;c<=2;c++){const X=x+a,Y=y+c;if(X>=0&&Y>=0&&X<N&&Y<N&&b[Y*N+X]<0)C.add(Y*N+X)}}});if(!C.size)C.add(112);
let bs=-1,pk;for(const i of C){const x=i%N,y=i/N|0,a=ls(b,x,y,me),d=ls(b,x,y,1-me),s=a>=1e5?1e9:d>=1e5?1e8:a+d*1.1+Math.random();if(s>bs){bs=s;pk=i}}op(g,pk)},
chess:g=>ca(g,best(g))};
function nxt(g){if(g.over||!g.m||g.turn==g.pl)return;g.busy=1;setTimeout(()=>{if(GM[g.g]!==g)return;try{play(g,()=>AI[g.g](g))}catch(e){console.error(e)}g.busy=0;render();anim(g)},250)}
function newGame(k,m){const g={id:++cnt,g:k,m:m||0,turn:0,over:0,res:null,busy:0};g.pl=g.m==2?1:0;
if(k=='ttt')g.b=Array(9).fill(-1);
if(k=='omok'){g.b=Array(225).fill(-1);g.n=0;g.last=-1}
if(k=='chess'){g.b=INIT.slice();g.t=1;g.c=15;g.ep=-1;g.hm=0;g.K=[60,4];g.ph=[];g.ph.push(ck(g));g.sel=-1;g.last=null;g.chk=0}
GM[k]=cur=g;nxt(g);return g}
/* ===== 화면 ===== */
const stat=g=>{if(g.over){const w=g.res;return(g.why?t(g.why)+' · ':'')+(w==2?t('v_dr'):g.m?t(w==g.pl?'v_yw':'v_yl'):pn(g,w)+' '+t('v_wins'))}
if(g.busy)return t('v_th');return(g.m?t('v_you')+' ('+pn(g,g.pl)+')':pn(g,g.turn)+' '+t('v_turn'))+(g.chk?' · '+t('v_ck'):'')};
const dc=(g,p)=>g.g=='ttt'?['var(--ac)','#FF9F43'][p]:(g.g=='omok'?['#14112B','#fff']:['#fff','#14112B'])[p];
const GL=['','♟\uFE0E','♞\uFE0E','♝\uFE0E','♜\uFE0E','♛\uFE0E','♚\uFE0E'];
const bTTT=g=>`<div class="tb">${g.b.map((v,i)=>`<div class="tc ${v==0?'x':v==1?'o':''} ${g.line&&g.line.includes(i)?'w':''}" data-a="vsc" data-i="${i}">${v<0?'':'XO'[v]}</div>`).join('')}</div>`;
const bOmok=g=>{let s='<svg class="ob" viewBox="0 0 15 15">';for(let k=0;k<15;k++)s+=`<line x1=".5" y1="${k+.5}" x2="14.5" y2="${k+.5}"/><line y1=".5" x1="${k+.5}" y2="14.5" x2="${k+.5}"/>`;
[3,7,11].forEach(a=>[3,7,11].forEach(b=>{if((a==7)==(b==7)||(a==7&&b==7))s+=`<circle cx="${a+.5}" cy="${b+.5}" r=".1" fill="var(--mu)"/>`}));
g.b.forEach((v,i)=>{const x=i%N+.5,y=(i/N|0)+.5;if(v>=0)s+=`<circle cx="${x}" cy="${y}" r=".44" class="${v?'sw':'sb'}"/>`;if(i==g.last)s+=`<circle cx="${x}" cy="${y}" r=".13" fill="#FF5C6C"/>`;if(g.line&&g.line.includes(i))s+=`<circle cx="${x}" cy="${y}" r=".5" class="wl"/>`;if(v<0)s+=`<rect x="${x-.5}" y="${y-.5}" width="1" height="1" fill="transparent" data-a="vsc" data-i="${i}"/>`});return s+'</svg>'};
const bChess=g=>{const fl=g.m==2,tg=new Set(g.sel>=0?lg(g).filter(m=>m.f==g.sel).map(m=>m.t):[]);let h='<div class="cb">';
for(let d=0;d<64;d++){const q=fl?63-d:d,p=g.b[q],c=['cc',((q>>3)+(q&7))%2?'d':'l'];if(g.last&&g.last.includes(q))c.push('lm');if(g.sel==q)c.push('sel');if(tg.has(q))c.push(p?'cp':'mv');if(g.chk&&p==g.t*6)c.push('ck');
h+=`<div class="${c.join(' ')}" data-a="vsc" data-i="${q}">${p?`<span class="${p>0?'pw':'pb'}">${GL[Math.abs(p)]}</span>`:''}</div>`}return h+'</div>'};
R.vs=()=>`<h2>${t('v_vs')}</h2><p style="color:var(--mu);margin:0 0 12px">${t('v_pick')}</p>`+['ttt','omok','chess'].map(k=>`<button class="li" data-a="vsg" data-g="${k}">${ic(k,28)}<b>${t('v_'+k)}</b></button>`).join('');
R.vsg=()=>{const g=cur;if(!g)return R.vs();const w=g.over&&g.res<2?g.res:g.turn;
return `<h2>${t('v_'+g.g)}</h2><div class="seg" style="margin-bottom:8px">${[0,1,2].map(m=>`<button class="sm ${g.m==m?'pri':''}" data-a="vsm" data-m="${m}">${t('v_m'+m)}</button>`).join('')}</div><div class="stt"><i class="pd" style="background:${dc(g,w)}"></i><span>${stat(g)}</span></div>${g.g=='ttt'?bTTT(g):g.g=='omok'?bOmok(g):bChess(g)}<button class="pri" data-a="vsn" style="width:100%;margin-top:12px">${t('v_new')}</button><p class="empty" style="padding:10px 0 0;font-size:13px">${t('v_h_'+g.g)}</p>`};
R.vsCard=()=>`<button class="card vsc" data-a="go" data-v="vs">${ic('vs',32)}<div><b>${t('v_vs')}</b><small>${t('v_sub')}</small></div></button>`;
Object.assign(AC,{snd:a=>{S.mute=a.v2=='1'?1:0;save();render();sfx('tap')},vsg:a=>{cur=GM[a.g]||newGame(a.g);go('vsg')},vsm:a=>{newGame(cur.g,+a.m);render()},vsn:()=>{newGame(cur.g,cur.m);render()},
vsc:a=>{const g=cur,i=+a.i;if(!g||g.over||g.busy||(g.m&&g.turn!=g.pl))return;play(g,()=>{if(g.g=='ttt')tp(g,i);else if(g.g=='omok')op(g,i);else ct(g,i)});render();anim(g);nxt(g)}});
})();
{const k=ymd(new Date());if(!S.sn)S.sn=k;if(!S.ud.includes(k)){S.ud.push(k);save()}}
render();if(wxStale())wx();

if(q=='memo'||q=='timer')go(q);else if(q=='task')setTimeout(()=>{const x=$('#qt');x&&x.focus()},60)}}
